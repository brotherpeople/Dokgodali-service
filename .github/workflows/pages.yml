name: Deploy dev site to GitHub Pages

# dev 브랜치의 public/ 폴더만 GitHub Pages(테스트 사이트)에 올린다.
# 저장소 Settings → Pages → Source를 "GitHub Actions"로 바꿔 둬야 동작한다.
on:
  push:
    branches: [dev]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-pages-artifact@v4
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
