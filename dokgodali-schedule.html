<script>
// --- Supabase Client Initialization ---
const SUPABASE_URL = "https://wxfqakwnbqapatclybiz.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Ind4ZnFha3duYnFhcGF0Y2x5Yml6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc3NTQ5NjQsImV4cCI6MjEwMzMzMDk2NH0._YGTlvj8y2gkIMdrzArKXbwAer1ZMwQCgRN1vz7wiPc";

const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

// Multi-tab BroadcastChannel for 0.01s local tab sync
const localSyncChannel = ('BroadcastChannel' in window) ? new BroadcastChannel('dokgodali_local_sync') : null;
let realtimeChannel = null;

const CREW_USERS = [
  { id: 'crew1', name: '홍길동', phone: '+49 171 1111111', canDrive: true },
  { id: 'crew2', name: '김철수', phone: '+49 172 2222222', canDrive: false },
  { id: 'crew3', name: '이영희', phone: '+49 173 3333333', canDrive: true },
  { id: 'crew4', name: '박민수', phone: '+49 174 4444444', canDrive: false }
];

// 데모용 "오늘" 날짜 고정값 — 실제 서비스 전환 시 new Date() 기반으로 교체
const TODAY_DATE = '2026-09-01';

const INVITE_CODE = 'DKGD-2026-BERLIN';

const VEHICLE_DUTIES = [
  { value: 'none', label: '대여 없음' },
  { value: 'miles_l', label: 'Miles L' },
  { value: 'miles_xl', label: 'Miles XL' }
];

function vehicleDutyLabel(value) {
  const duty = VEHICLE_DUTIES.find(d => d.value === value);
  return duty ? duty.label : '';
}

function timeToMinutes(hhmm) {
  const [h, m] = hhmm.split(':').map(Number);
  return h * 60 + m;
}

function calcBreakMinutes(rawMinutes) {
  if (rawMinutes > 9 * 60) return 45;
  if (rawMinutes > 6 * 60) return 30;
  return 0;
}

function calcWorkLog(actualStart, actualEnd) {
  const rawMinutes = timeToMinutes(actualEnd) - timeToMinutes(actualStart);
  const breakMinutes = calcBreakMinutes(rawMinutes);
  const workedHours = Math.round(((rawMinutes - breakMinutes) / 60) * 100) / 100;
  return { breakMinutes, workedHours };
}

function populateWorklogTimeSelects() {
  const starts = document.getElementById('worklog-start-select');
  const ends = document.getElementById('worklog-end-select');
  if (!starts || starts.options.length > 0) return;
  for (let m = 6 * 60; m <= 22 * 60; m += 15) {
    const h = String(Math.floor(m / 60)).padStart(2, '0');
    const mm = String(m % 60).padStart(2, '0');
    const label = `${h}:${mm}`;
    starts.appendChild(new Option(label, label));
    ends.appendChild(new Option(label, label));
  }
  starts.value = '07:00';
  ends.value = '16:00';
}

function updateWorklogPreview() {
  const start = document.getElementById('worklog-start-select').value;
  const end = document.getElementById('worklog-end-select').value;
  const preview = document.getElementById('worklog-preview');
  const raw = timeToMinutes(end) - timeToMinutes(start);
  if (raw <= 0) {
    preview.textContent = '종료 시간은 시작 시간보다 늦어야 합니다.';
    return;
  }
  const { breakMinutes, workedHours } = calcWorkLog(start, end);
  preview.textContent = `예상 근무시간: ${workedHours}시간 (휴게 ${breakMinutes}분 자동 적용)`;
}

async function submitWorklog(scheduleId) {
  const currentUserId = state.currentRole;
  const start = document.getElementById('worklog-start-select').value;
  const end = document.getElementById('worklog-end-select').value;
  const raw = timeToMinutes(end) - timeToMinutes(start);
  if (raw <= 0) return;
  const { breakMinutes, workedHours } = calcWorkLog(start, end);

  const existing = state.workLogs.find(w => w.scheduleId === scheduleId && w.userId === currentUserId);
  const myJob = state.schedules.find(s => s.id === scheduleId);
  const myAssign = myJob.assignments.find(a => a.userId === currentUserId);

  const row = {
    schedule_id: scheduleId,
    user_id: currentUserId,
    job_date: myJob.jobDate,
    assigned_start: myAssign.startTime,
    actual_start: start,
    actual_end: end,
    break_minutes: breakMinutes,
    worked_hours: workedHours,
    status: 'pending',
    reject_reason: null,
    submitted_at: new Date().toISOString(),
    confirmed_at: null
  };

  if (existing) {
    await sb.from('work_logs').update(row).eq('id', existing.id);
  } else {
    await sb.from('work_logs').insert(row);
  }
  await loadDataFromSupabase();
  renderApp();
}

function renderWorklogSection(myJob, currentUserId) {
  const section = document.getElementById('crew-worklog-section');
  section.classList.remove('hidden');
  populateWorklogTimeSelects();

  const formView = document.getElementById('worklog-form-view');
  const statusView = document.getElementById('worklog-status-view');
  const existing = state.workLogs.find(w => w.scheduleId === myJob.id && w.userId === currentUserId);

  if (existing && existing.status !== 'rejected') {
    formView.classList.add('hidden');
    statusView.classList.remove('hidden');
    const badgeClass = existing.status === 'confirmed' ? 'worklog-status-confirmed' : 'worklog-status-pending';
    const badgeText = existing.status === 'confirmed' ? '승인됨' : '제출 완료 · 승인 대기중';
    statusView.innerHTML = `
      <span class="worklog-status-badge ${badgeClass}">${badgeText}</span>
      <div style="font-size:13px;">${existing.actualStart} ~ ${existing.actualEnd} (휴게 ${existing.breakMinutes}분, 실근무 ${existing.workedHours}시간)</div>
    `;
  } else {
    statusView.classList.add('hidden');
    formView.classList.remove('hidden');
    const existingBadge = formView.querySelector('.worklog-status-rejected');
    if (existingBadge) existingBadge.remove();
    if (existing && existing.status === 'rejected') {
      formView.insertAdjacentHTML('afterbegin', `<div class="worklog-status-badge worklog-status-rejected">반려됨: ${existing.rejectReason || ''}</div>`);
    }
    document.getElementById('worklog-start-select').onchange = updateWorklogPreview;
    document.getElementById('worklog-end-select').onchange = updateWorklogPreview;
    document.getElementById('worklog-submit-btn').onclick = () => submitWorklog(myJob.id);
    updateWorklogPreview();
  }
}

let state = {
  currentRole: 'admin',
  currentYear: 2026,
  currentMonth: 8,
  selectedDate: '2026-09-01',
  schedules: [],
  availability: {},
  workLogs: [],
  adminTab: 'dispatch'
};

async function init() {
  await loadDataFromSupabase();
  setupRealtime();
  setupBroadcastListener();
  renderApp();

  // Polling fallback every 4 seconds
  setInterval(async () => {
    await loadDataFromSupabase(true);
  }, 4000);
}

async function loadDataFromSupabase(isBackground = false) {
  try {
    // 1. Fetch schedules
    const { data: schedulesData } = await sb.from('schedules').select('*');
    if (schedulesData) {
      state.schedules = schedulesData.map(mapScheduleFromDB);
    }

    // 2. Fetch availability
    const { data: availData } = await sb.from('availability').select('*');
    if (availData) {
      const newAvail = {};
      availData.forEach(a => {
        newAvail[`${a.user_id}_${a.job_date}`] = a.is_available;
      });
      state.availability = newAvail;
    }

    // 3. Fetch work logs
    const { data: workLogsData } = await sb.from('work_logs').select('*');
    if (workLogsData) {
      state.workLogs = workLogsData.map(mapWorkLogFromDB);
    }

    if (isBackground) {
      renderApp();
    }
  } catch (e) {
    console.error('DB fetch exception:', e);
  }
}

function mapScheduleFromDB(s) {
  return {
    id: s.id,
    quoteNo: s.quote_no,
    quotePrice: s.quote_price,
    customerName: s.customer_name,
    customerPhone: s.customer_phone,
    jobDate: s.job_date,
    overallTimeRange: s.overall_time_range,
    originAddress: s.origin_address,
    originSpec: s.origin_spec,
    destAddress: s.dest_address,
    destSpec: s.dest_spec,
    vehicleType: s.vehicle_type,
    requiredWorkers: s.required_workers,
    notes: s.notes,
    assignments: s.assignments || []
  };
}

function mapWorkLogFromDB(w) {
  return {
    id: w.id,
    scheduleId: w.schedule_id,
    userId: w.user_id,
    jobDate: w.job_date,
    assignedStart: w.assigned_start,
    actualStart: w.actual_start,
    actualEnd: w.actual_end,
    breakMinutes: w.break_minutes,
    workedHours: w.worked_hours,
    status: w.status,
    rejectReason: w.reject_reason,
    submittedAt: w.submitted_at,
    confirmedAt: w.confirmed_at
  };
}

function setupRealtime() {
  realtimeChannel = sb.channel('dokgodali_realtime_room')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'schedules' }, async () => {
      await loadDataFromSupabase();
      renderApp();
    })
    .on('postgres_changes', { event: '*', schema: 'public', table: 'availability' }, async () => {
      await loadDataFromSupabase();
      renderApp();
    })
    .on('postgres_changes', { event: '*', schema: 'public', table: 'work_logs' }, async () => {
      await loadDataFromSupabase();
      renderApp();
    })
    .on('broadcast', { event: 'state_changed' }, async () => {
      await loadDataFromSupabase();
      renderApp();
    })
    .subscribe();
}

function setupBroadcastListener() {
  if (localSyncChannel) {
    localSyncChannel.onmessage = async () => {
      await loadDataFromSupabase();
      renderApp();
    };
  }
}

// Notify all other tabs and remote devices instantly
function broadcastChange() {
  if (localSyncChannel) {
    localSyncChannel.postMessage({ type: 'SYNC' });
  }
  if (realtimeChannel) {
    realtimeChannel.send({
      type: 'broadcast',
      event: 'state_changed',
      payload: { time: Date.now() }
    });
  }
}

function switchRole(roleKey) {
  state.currentRole = roleKey;

  const badge = document.getElementById('current-user-badge');
  const btnNew = document.getElementById('btn-open-new-schedule');

  if (roleKey === 'admin') {
    badge.className = 'badge badge-navy';
    badge.textContent = '관리자';
    btnNew.classList.remove('hidden');
  } else {
    const crew = CREW_USERS.find(c => c.id === roleKey);
    badge.className = 'badge badge-blue';
    badge.textContent = `${crew.name} (${crew.canDrive ? '운전가능' : '면허없음'})`;
    btnNew.classList.add('hidden');
  }

  renderApp();
}

function renderRoleSwitcherButtons() {
  const container = document.getElementById('role-buttons-container');
  container.querySelectorAll('.crew-role-btn').forEach(btn => btn.remove());

  CREW_USERS.forEach(u => {
    const todayJob = state.schedules.find(s => s.jobDate === TODAY_DATE && (s.assignments || []).some(a => a.userId === u.id));
    const myAssign = todayJob ? todayJob.assignments.find(a => a.userId === u.id) : null;
    const dutyLabel = myAssign && myAssign.vehicleDuty !== 'none' ? ` · ${vehicleDutyLabel(myAssign.vehicleDuty)}` : '';
    const label = myAssign ? `${u.name} (${myAssign.startTime}${dutyLabel})` : `${u.name} (미배정)`;

    const btn = document.createElement('button');
    btn.className = 'role-btn crew-role-btn';
    btn.dataset.role = u.id;
    btn.textContent = label;
    btn.onclick = () => switchRole(u.id);
    container.appendChild(btn);
  });

  container.querySelectorAll('.role-btn').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.role === state.currentRole);
  });
}

function renderApp() {
  renderRoleSwitcherButtons();

  const isAdmin = state.currentRole === 'admin';
  document.getElementById('admin-section').classList.toggle('hidden', !isAdmin);
  document.getElementById('crew-today-section').classList.toggle('hidden', isAdmin);
  document.getElementById('crew-calendar-section').classList.toggle('hidden', isAdmin);
  document.getElementById('crew-worklog-section').classList.toggle('hidden', isAdmin);
  document.getElementById('crew-history-section').classList.toggle('hidden', isAdmin);

  if (isAdmin) {
    document.getElementById('admin-worklog-section').classList.toggle('hidden', state.adminTab !== 'worklog');
    document.querySelector('.admin-layout').classList.toggle('hidden', state.adminTab !== 'dispatch');
    document.getElementById('admin-tab-dispatch-btn').classList.toggle('active', state.adminTab === 'dispatch');
    document.getElementById('admin-tab-worklog-btn').classList.toggle('active', state.adminTab === 'worklog');
    if (state.adminTab === 'worklog') {
      renderAdminWorklogTab();
    } else {
      renderAdminCalendar();
      renderAdminSelectedDateSchedules();
    }
  } else {
    renderCrewDashboard();
  }
}

function switchAdminTab(tab) {
  state.adminTab = tab;
  renderApp();
}

function renderAdminWorklogTab() {
  const list = document.getElementById('admin-worklog-pending-list');
  const pending = state.workLogs.filter(w => w.status === 'pending').sort((a, b) => a.jobDate.localeCompare(b.jobDate));

  if (pending.length === 0) {
    list.innerHTML = '<div class="worklog-history-empty">승인 대기중인 근무 기록이 없습니다.</div>';
    return;
  }

  list.innerHTML = pending.map(w => {
    const u = CREW_USERS.find(c => c.id === w.userId);
    return `
      <div class="worklog-pending-item" id="worklog-item-${w.id}">
        <div>
          <div>${u ? u.name : w.userId} · ${w.jobDate} ${w.actualStart}~${w.actualEnd}</div>
          <div style="font-size:12px; color:var(--text-secondary);">휴게 ${w.breakMinutes}분 · 실근무 ${w.workedHours}시간</div>
        </div>
        <div>
          <button class="btn btn-primary btn-sm" onclick="approveWorklog('${w.id}')">승인</button>
          <button class="btn btn-secondary btn-sm" onclick="openRejectWorklog('${w.id}')">반려</button>
        </div>
      </div>
    `;
  }).join('');
}

async function approveWorklog(id) {
  await sb.from('work_logs').update({ status: 'confirmed', confirmed_at: new Date().toISOString() }).eq('id', id);
  await loadDataFromSupabase();
  renderApp();
}

function openRejectWorklog(id) {
  const item = document.getElementById(`worklog-item-${id}`);
  if (item.querySelector('.worklog-reject-form')) return;
  const form = document.createElement('div');
  form.className = 'worklog-reject-form';
  form.innerHTML = `
    <input type="text" placeholder="반려 사유" id="reject-reason-${id}">
    <button class="btn btn-primary btn-sm" onclick="submitRejectWorklog('${id}')">확인</button>
  `;
  item.appendChild(form);
}

async function submitRejectWorklog(id) {
  const reason = document.getElementById(`reject-reason-${id}`).value.trim();
  if (!reason) return;
  await sb.from('work_logs').update({ status: 'rejected', reject_reason: reason }).eq('id', id);
  await loadDataFromSupabase();
  renderApp();
}

function renderAdminCalendar() {
  document.getElementById('admin-cal-title').textContent = `${state.currentYear}년 ${state.currentMonth + 1}월`;
  const container = document.getElementById('admin-cal-days');
  container.innerHTML = '';

  const daysInMonth = new Date(state.currentYear, state.currentMonth + 1, 0).getDate();
  // getDay()는 일요일=0 기준이라, 월요일 시작 그리드에 맞게 (일=0 -> 6, 월=1 -> 0, ...)로 보정합니다.
  const firstDayIndex = (new Date(state.currentYear, state.currentMonth, 1).getDay() + 6) % 7;

  for (let i = 0; i < firstDayIndex; i++) {
    const blank = document.createElement('div');
    blank.className = 'cal-day other-month';
    container.appendChild(blank);
  }

  for (let day = 1; day <= daysInMonth; day++) {
    const dateStr = `${state.currentYear}-${String(state.currentMonth + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
    const dayEl = document.createElement('div');
    dayEl.className = 'cal-day';
    if (dateStr === state.selectedDate) dayEl.classList.add('selected');
    if (dateStr === TODAY_DATE) dayEl.classList.add('today');

    const dayNum = document.createElement('div');
    dayNum.className = 'cal-day-num';
    dayNum.textContent = day;
    dayEl.appendChild(dayNum);

    const daySchedules = state.schedules.filter(s => s.jobDate === dateStr);
    daySchedules.forEach(sch => {
      const pill = document.createElement('div');
      const assignedCount = sch.assignments ? sch.assignments.length : 0;
      const isDeficit = assignedCount < sch.requiredWorkers;
      pill.className = `cal-event-pill ${isDeficit ? 'deficit' : ''}`;
      pill.textContent = `${sch.customerName} (${assignedCount}/${sch.requiredWorkers})`;
      dayEl.appendChild(pill);
    });

    let availCount = 0;
    CREW_USERS.forEach(u => {
      if (state.availability[`${u.id}_${dateStr}`] !== false) availCount++;
    });
    const availSummary = document.createElement('div');
    availSummary.style.fontSize = '9px';
    availSummary.style.color = '#94a3b8';
    availSummary.style.marginTop = '2px';
    availSummary.textContent = `${availCount}명 가용`;
    dayEl.appendChild(availSummary);

    dayEl.onclick = () => {
      state.selectedDate = dateStr;
      renderAdminCalendar();
      renderAdminSelectedDateSchedules();
    };

    container.appendChild(dayEl);
  }
}

function renderAdminSelectedDateSchedules() {
  document.getElementById('admin-selected-date-title').textContent = `${state.selectedDate}`;
  
  let availList = [];
  let unavailList = [];
  CREW_USERS.forEach(u => {
    if (state.availability[`${u.id}_${state.selectedDate}`] !== false) availList.push(u);
    else unavailList.push(u);
  });

  document.getElementById('admin-crew-avail-summary').innerHTML = 
    `가용 ${availList.length}명 (${availList.map(u => u.name).join(',') || '-'}) · 불가 ${unavailList.length}명`;

  const listContainer = document.getElementById('admin-schedules-list');
  listContainer.innerHTML = '';

  const daySchedules = state.schedules.filter(s => s.jobDate === state.selectedDate);

  if (daySchedules.length === 0) {
    listContainer.innerHTML = `
      <div style="text-align: center; padding: 30px 10px; color: var(--text-muted); font-size: 13px;">
        일정이 없습니다.
        <div style="margin-top: 8px;">
          <button class="btn btn-primary btn-sm" onclick="openCreateScheduleModal('${state.selectedDate}')">+ 스케줄 추가</button>
        </div>
      </div>
    `;
    return;
  }

  daySchedules.forEach(sch => {
    const assignedCount = sch.assignments ? sch.assignments.length : 0;
    const isFull = assignedCount >= sch.requiredWorkers;

    const item = document.createElement('div');
    item.className = 'schedule-item';
    item.innerHTML = `
      <div class="schedule-item-top">
        <div>
          <span class="badge ${isFull ? 'badge-green' : 'badge-warning'}">${assignedCount}/${sch.requiredWorkers}명</span>
          <strong style="font-size: 13.5px; margin-left: 4px;">${sch.customerName}</strong>
          <span style="font-size: 11.5px; color: var(--text-muted); margin-left: 4px;">${sch.overallTimeRange}</span>
        </div>
        <div style="display: flex; gap: 4px;">
          <button class="btn btn-whatsapp btn-sm" onclick="openWhatsappBriefing('${sch.id}')">WhatsApp</button>
          <button class="btn btn-danger-outline btn-sm" onclick="deleteSchedule('${sch.id}')">삭제</button>
        </div>
      </div>

      <div style="font-size: 12px; color: var(--text-secondary); margin-bottom: 8px; background: #f8fafc; padding: 6px 8px; border-radius: 4px;">
        ${sch.originAddress} ➔ ${sch.destAddress}
      </div>

      <div id="assign-rows-${sch.id}"></div>

      <div style="display: flex; gap: 6px; margin-top: 8px;">
        <select id="select-add-crew-${sch.id}" class="form-control" style="font-size: 11.5px; padding: 4px 6px; flex: 1;">
          <option value="">+ 크루 배정</option>
          ${CREW_USERS.map(u => {
            const isAssigned = (sch.assignments || []).some(a => a.userId === u.id);
            if (isAssigned) return '';
            const isAvail = state.availability[`${u.id}_${state.selectedDate}`] !== false;
            return `<option value="${u.id}">${u.name} (${isAvail ? '가능' : '불가'})</option>`;
          }).join('')}
        </select>
        <button class="btn btn-secondary btn-sm" onclick="addCrewToSchedule('${sch.id}')">추가</button>
      </div>
    `;

    listContainer.appendChild(item);
    renderScheduleAssignmentsList(sch);
  });
}

function renderScheduleAssignmentsList(sch) {
  const container = document.getElementById(`assign-rows-${sch.id}`);
  if (!container) return;
  container.innerHTML = '';

  if (!sch.assignments || sch.assignments.length === 0) {
    container.innerHTML = `<div style="font-size: 11.5px; color: var(--text-muted); padding: 4px 0;">배정 인원 없음</div>`;
    return;
  }

  sch.assignments.forEach(assign => {
    const user = CREW_USERS.find(u => u.id === assign.userId);
    if (!user) return;

    const row = document.createElement('div');
    row.className = 'assign-row';
    row.innerHTML = `
      <span><strong>${user.name}</strong> (${user.canDrive ? '운전' : '일반'})</span>
      <div style="display: flex; gap: 4px; align-items: center;">
        <input type="text" class="assign-select" style="width: 55px;" value="${assign.startTime || '08:00'}" 
               onchange="updateAssignmentTime('${sch.id}', '${user.id}', this.value)">
        <select class="assign-select" onchange="updateAssignmentDuty('${sch.id}', '${user.id}', this.value)"
                ${user.canDrive ? '' : 'disabled title="면허가 없는 크루는 차량 대여 담당을 맡을 수 없습니다"'}>
          ${VEHICLE_DUTIES.map(d => `<option value="${d.value}" ${assign.vehicleDuty === d.value ? 'selected' : ''}>${d.label}</option>`).join('')}
        </select>
        <button class="btn btn-secondary btn-sm" style="padding: 2px 5px; font-size: 10px;" onclick="removeCrewFromSchedule('${sch.id}', '${user.id}')">✕</button>
      </div>
    `;
    container.appendChild(row);
  });
}

function renderCrewDashboard() {
  const currentUserId = state.currentRole;
  const currentUser = CREW_USERS.find(u => u.id === currentUserId);
  if (!currentUser) return;

  const todayStr = TODAY_DATE;
  const myJob = state.schedules.find(s => s.jobDate === todayStr && (s.assignments || []).some(a => a.userId === currentUserId));

  const todaySection = document.getElementById('crew-today-section');
  if (myJob) {
    todaySection.classList.remove('hidden');
    const myAssign = myJob.assignments.find(a => a.userId === currentUserId);

    document.getElementById('crew-today-title').textContent = `${myJob.customerName} 님 이사/운송`;
    document.getElementById('crew-today-time').textContent = myAssign.startTime || '08:00';
    document.getElementById('crew-today-overall-time').textContent = `(전체: ${myJob.overallTimeRange})`;

    const dutyBadge = document.getElementById('crew-duty-badge');
    if (myAssign.vehicleDuty !== 'none') {
      dutyBadge.classList.remove('hidden');
      document.getElementById('crew-duty-text').textContent = `차량 대여 필요: ${vehicleDutyLabel(myAssign.vehicleDuty)}`;
    } else {
      dutyBadge.classList.add('hidden');
    }

    document.getElementById('crew-origin-addr').textContent = myJob.originAddress;
    document.getElementById('crew-origin-spec').textContent = myJob.originSpec || '';
    document.getElementById('crew-origin-map-link').href = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(myJob.originAddress)}`;

    document.getElementById('crew-dest-addr').textContent = myJob.destAddress;
    document.getElementById('crew-dest-spec').textContent = myJob.destSpec || '';
    document.getElementById('crew-dest-map-link').href = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(myJob.destAddress)}`;

    const chipContainer = document.getElementById('crew-members-list');
    chipContainer.innerHTML = '';
    myJob.assignments.forEach(a => {
      const u = CREW_USERS.find(user => user.id === a.userId);
      if (!u) return;
      const item = document.createElement('div');
      const isMe = u.id === currentUserId;
      let duty = a.vehicleDuty !== 'none' ? ` · ${vehicleDutyLabel(a.vehicleDuty)}` : '';
      item.className = `crew-tag ${isMe ? 'me' : ''}`;
      item.innerHTML = `<span>${u.name}${isMe ? ' (나)' : ''}</span><span>${a.startTime}${duty}</span>`;
      chipContainer.appendChild(item);
    });

    document.getElementById('crew-notes-text').textContent = myJob.notes || '없음';
    renderWorklogSection(myJob, currentUserId);
  } else {
    todaySection.innerHTML = `
      <div class="today-hero-card" style="text-align: center; padding: 20px; color: var(--text-muted); font-size: 13px;">
        오늘 배정된 작업 일정이 없습니다.
      </div>
    `;
    todaySection.classList.remove('hidden');
    document.getElementById('crew-worklog-section').classList.add('hidden');
  }

  renderCrewCalendar();
  renderCrewHistory(currentUserId);
}

function renderCrewHistory(currentUserId) {
  const section = document.getElementById('crew-history-section');
  section.classList.remove('hidden');
  const list = document.getElementById('crew-history-list');
  const myLogs = state.workLogs
    .filter(w => w.userId === currentUserId)
    .sort((a, b) => b.jobDate.localeCompare(a.jobDate));

  if (myLogs.length === 0) {
    list.innerHTML = '<div class="worklog-history-empty">아직 제출한 근무 기록이 없습니다.</div>';
    return;
  }

  const statusLabel = { pending: '승인 대기', confirmed: '승인됨', rejected: '반려됨' };
  list.innerHTML = myLogs.map(w => `
    <div class="worklog-history-item">
      <span>${w.jobDate} · ${w.actualStart}~${w.actualEnd}</span>
      <span>휴게 ${w.breakMinutes}분 · ${w.workedHours}h · ${statusLabel[w.status]}</span>
    </div>
  `).join('');
}

function renderCrewCalendar() {
  document.getElementById('crew-cal-title').textContent = `${state.currentYear}년 ${state.currentMonth + 1}월`;
  const container = document.getElementById('crew-cal-days');
  container.innerHTML = '';

  const daysInMonth = new Date(state.currentYear, state.currentMonth + 1, 0).getDate();
  // getDay()는 일요일=0 기준이라, 월요일 시작 그리드에 맞게 (일=0 -> 6, 월=1 -> 0, ...)로 보정합니다.
  const firstDayIndex = (new Date(state.currentYear, state.currentMonth, 1).getDay() + 6) % 7;

  for (let i = 0; i < firstDayIndex; i++) {
    const blank = document.createElement('div');
    blank.className = 'cal-day other-month';
    container.appendChild(blank);
  }

  for (let day = 1; day <= daysInMonth; day++) {
    const dateStr = `${state.currentYear}-${String(state.currentMonth + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
    const dayEl = document.createElement('div');
    dayEl.className = 'cal-day';
    if (dateStr === TODAY_DATE) dayEl.classList.add('today');

    const dayNum = document.createElement('div');
    dayNum.className = 'cal-day-num';
    dayNum.textContent = day;
    dayEl.appendChild(dayNum);

    const isAvailable = state.availability[`${state.currentRole}_${dateStr}`] !== false;
    const tag = document.createElement('div');
    tag.className = `avail-btn-tag ${isAvailable ? 'avail' : 'unavail'}`;
    tag.textContent = isAvailable ? '가능' : '불가';
    dayEl.appendChild(tag);

    const assignedJob = state.schedules.find(s => s.jobDate === dateStr && (s.assignments || []).some(a => a.userId === state.currentRole));
    if (assignedJob) {
      const myAssign = assignedJob.assignments.find(a => a.userId === state.currentRole);
      const pill = document.createElement('div');
      pill.className = 'cal-event-pill my-job';
      pill.textContent = `배정 ${myAssign.startTime}`;
      dayEl.appendChild(pill);
    }

    dayEl.onclick = async () => {
      const currentVal = state.availability[`${state.currentRole}_${dateStr}`] !== false;
      const nextVal = !currentVal;
      
      // 1. Optimistic UI update
      state.availability[`${state.currentRole}_${dateStr}`] = nextVal;
      renderCrewCalendar();
      showToast(`${dateStr} [${nextVal ? '가능' : '불가'}]`);

      // 2. Broadcast immediately to all other open tabs
      broadcastChange();

      // 3. Upsert to Supabase
      try {
        await sb.from('availability').upsert({
          user_id: state.currentRole,
          job_date: dateStr,
          is_available: nextVal
        });
        broadcastChange();
      } catch (err) {
        console.error('Availability update failed:', err);
      }
    };

    container.appendChild(dayEl);
  }
}

function openCreateScheduleModal(defaultDate) {
  document.getElementById('schedule-form').reset();
  document.getElementById('f-job-date').value = defaultDate || state.selectedDate;
  document.getElementById('schedule-modal').classList.remove('hidden');
}

function closeScheduleModal() {
  document.getElementById('schedule-modal').classList.add('hidden');
}

async function handleSaveSchedule(e) {
  e.preventDefault();
  const quoteNo = document.getElementById('f-quote-no').value.trim();
  const quotePrice = document.getElementById('f-quote-price').value.trim();
  const customerName = document.getElementById('f-customer-name').value.trim();
  const customerPhone = document.getElementById('f-customer-phone').value.trim();
  const jobDate = document.getElementById('f-job-date').value;
  const timeRange = document.getElementById('f-time-range').value.trim();
  const originAddr = document.getElementById('f-origin-addr').value.trim();
  const originSpec = document.getElementById('f-origin-spec').value.trim();
  const destAddr = document.getElementById('f-dest-addr').value.trim();
  const destSpec = document.getElementById('f-dest-spec').value.trim();
  const requiredWorkers = parseInt(document.getElementById('f-required-workers').value, 10) || 2;
  const vehicleType = document.getElementById('f-vehicle-type').value;
  const notes = document.getElementById('f-notes').value.trim();

  const newId = 'sch-' + Date.now();
  const dbPayload = {
    id: newId,
    quote_no: quoteNo,
    quote_price: quotePrice ? parseFloat(quotePrice) : null,
    customer_name: customerName,
    customer_phone: customerPhone,
    job_date: jobDate,
    overall_time_range: timeRange,
    origin_address: originAddr,
    origin_spec: originSpec,
    dest_address: destAddr,
    dest_spec: destSpec,
    required_workers: requiredWorkers,
    vehicle_type: vehicleType,
    notes: notes,
    assignments: []
  };

  const { error } = await sb.from('schedules').insert(dbPayload);
  if (error) {
    alert('DB 저장 오류: ' + error.message);
    return;
  }

  state.selectedDate = jobDate;
  closeScheduleModal();
  await loadDataFromSupabase();
  renderApp();
  broadcastChange();
  showToast('스케줄이 저장되었습니다.');
}

async function deleteSchedule(scheduleId) {
  if (!confirm('삭제하시겠습니까?')) return;
  await sb.from('schedules').delete().eq('id', scheduleId);
  await loadDataFromSupabase();
  renderApp();
  broadcastChange();
  showToast('삭제되었습니다.');
}

async function addCrewToSchedule(scheduleId) {
  const select = document.getElementById(`select-add-crew-${scheduleId}`);
  const userId = select.value;
  if (!userId) return;
  const sch = state.schedules.find(s => s.id === scheduleId);
  if (!sch) return;

  if (!sch.assignments) sch.assignments = [];
  const defaultStartTime = sch.overallTimeRange.split('~')[0].trim() || '08:00';

  sch.assignments.push({
    userId,
    startTime: defaultStartTime,
    vehicleDuty: 'none'
  });

  await sb.from('schedules').update({ assignments: sch.assignments }).eq('id', scheduleId);
  renderApp();
  broadcastChange();
}

async function removeCrewFromSchedule(scheduleId, userId) {
  const sch = state.schedules.find(s => s.id === scheduleId);
  if (!sch || !sch.assignments) return;
  sch.assignments = sch.assignments.filter(a => a.userId !== userId);
  await sb.from('schedules').update({ assignments: sch.assignments }).eq('id', scheduleId);
  renderApp();
  broadcastChange();
}

async function updateAssignmentTime(scheduleId, userId, newTime) {
  const sch = state.schedules.find(s => s.id === scheduleId);
  if (!sch || !sch.assignments) return;
  const assign = sch.assignments.find(a => a.userId === userId);
  if (assign) {
    assign.startTime = newTime;
    await sb.from('schedules').update({ assignments: sch.assignments }).eq('id', scheduleId);
    broadcastChange();
  }
}

async function updateAssignmentDuty(scheduleId, userId, newDuty) {
  const sch = state.schedules.find(s => s.id === scheduleId);
  if (!sch || !sch.assignments) return;
  const assign = sch.assignments.find(a => a.userId === userId);
  if (assign) {
    assign.vehicleDuty = newDuty;
    await sb.from('schedules').update({ assignments: sch.assignments }).eq('id', scheduleId);
    broadcastChange();
  }
}

function openWhatsappBriefing(scheduleId) {
  const sch = state.schedules.find(s => s.id === scheduleId);
  if (!sch) return;

  let crewLines = '';
  if (sch.assignments && sch.assignments.length > 0) {
    crewLines = sch.assignments.map(a => {
      const u = CREW_USERS.find(user => user.id === a.userId);
      let duty = a.vehicleDuty !== 'none' ? ` (${vehicleDutyLabel(a.vehicleDuty)})` : '';
      return `• ${u.name}: ${a.startTime}${duty}`;
    }).join('\n');
  } else {
    crewLines = '• (미배정)';
  }

  const text = `[독고달이 배정]
일시: ${sch.jobDate} (${sch.overallTimeRange})
고객: ${sch.customerName}

상차: ${sch.originAddress} (${sch.originSpec || ''})
하차: ${sch.destAddress} (${sch.destSpec || ''})

크루:
${crewLines}

메모: ${sch.notes || '없음'}`;

  document.getElementById('whatsapp-text-content').value = text;
  document.getElementById('btn-open-wa').href = `https://wa.me/?text=${encodeURIComponent(text)}`;
  document.getElementById('whatsapp-modal').classList.remove('hidden');
}

function closeWhatsappModal() {
  document.getElementById('whatsapp-modal').classList.add('hidden');
}

function copyWhatsappText() {
  const textarea = document.getElementById('whatsapp-text-content');
  textarea.select();
  navigator.clipboard.writeText(textarea.value);
  showToast('복사되었습니다.');
}

function copyInviteCode() {
  navigator.clipboard.writeText(INVITE_CODE);
  showToast('초대코드가 복사되었습니다.');
}

function changeMonth(delta) {
  state.currentMonth += delta;
  if (state.currentMonth < 0) {
    state.currentMonth = 11;
    state.currentYear -= 1;
  } else if (state.currentMonth > 11) {
    state.currentMonth = 0;
    state.currentYear += 1;
  }
  renderApp();
}

function showToast(msg) {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 1600);
}

document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
